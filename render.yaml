# Free interview demo: cold starts can exceed 500 ms; PostgreSQL expires in 30 days.
services:
  - type: web
    name: walnut-transactions-free
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    healthCheckPath: /
    dockerCommand: python -m app.service
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: walnut-transactions-free-db
          property: connectionString
      - key: PROCESSING_DELAY_SECONDS
        value: "30"
      - key: WORKER_CONCURRENCY
        value: "20"
      - key: POLL_INTERVAL_SECONDS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
databases:
  - name: walnut-transactions-free-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
